name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python3 -m venv ./.python3
          source .python3/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install -U -r requirements.txt

      - name: Install compiler
        run: |
            scripts/setup_compiler.sh

      - name: Test verification and disc preparation tools
        run: |
          source .python3/bin/activate
          python3 -m unittest discover -s tools/tests -v

      - name: Setup Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

            
      - name: Setup build environment
        run: |
          sudo apt-get install -y binutils-mips-linux-gnu
          mkdir -p iso
          wget --no-check-certificate "${{ secrets.FILE_URL }}" -O iso/SCPS_150.97
          wget --no-check-certificate "${{ secrets.KERNEL_URL }}" -O iso/KERNEL.XFF

      - name: Build main ELF
        run: |
          source .python3/bin/activate
          make loader

      - name: Build KERNEL.XFF
        run: |
          source .python3/bin/activate
          make kernel

      - name: Verify kernel instructions before XFF patching
        run: |
          mkdir -p target/ci
          python3 tools/verify_kernel.py --original iso/KERNEL.XFF \
            --compiled build/KERNEL.XFF/KERNEL.XFF.elf \
            --report target/ci/kernel-verification.json

      - name: Calculate local decompilation progress
        run: |
          source .python3/bin/activate
          python3 scripts/upload_progress.py --update-badges

      - name: Update fork README counters
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer commit is on main; its build will update the counters."
            exit 0
          fi
          git add docs/progress/loader.svg docs/progress/kernel.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update decompilation progress counters [skip ci]"
          git push origin HEAD:main

      - name: Save verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-verification
          path: target/ci/kernel-verification.json
          if-no-files-found: ignore
